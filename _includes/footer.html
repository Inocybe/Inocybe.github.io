<footer class="site-footer">
  <p class="footer-label">Contacts:</p>
  <div class="footer-links">
    <a href="mailto:{{ site.email }}">{{ site.email }}</a>
    {% if site.github_url %}<a href="{{ site.github_url }}" target="_blank" rel="noopener">GitHub</a>{% endif %}
    {% if site.linkedin_url %}<a href="{{ site.linkedin_url }}" target="_blank" rel="noopener">LinkedIn</a>{% endif %}
    {% if site.resume %}<a href="{{ site.resume }}" target="_blank" rel="noopener">Resume</a>{% endif %}
  </div>
  <p class="footer-copy">&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</p>
</footer>
