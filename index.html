---
layout: default
title: Home
---
<section class="intro">
  <h1>Hi, I'm Your Name</h1>
  <p>Incoming ECE student at UW, focused on chip design.</p>
</section>

<section class="project-list">
  <h2>Projects</h2>
  {% for project in site.projects %}
    <a class="project-card" href="{{ project.url | relative_url }}">
        <img src="{{ project.thumbnail | relative_url }}" alt="{{ project.title }} image">
        <h3>{{ project.title }}</h3>
        <p>{{ project.description }}</p>
        <p>{{ project.tags | join: ", " }}</p>
    </a>
  {% endfor %}
</section>
