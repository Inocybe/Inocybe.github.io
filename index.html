---
layout: default
title: Home
---
<section class="hero">
  <h1>{{ site.title }}</h1>
  <p>{{ site.description }}</p>
</section>

<section class="project-list">
  {% for project in site.projects %}
  <div class="project-row">
    <div class="project-info">
      <h2>{{ project.title }}</h2>
      <p class="date">{{ project.date_display }}</p>
      <p class="desc">{{ project.description }}</p>
      <p class="tags">{{ project.tags | join: "   " }}</p>
    </div>
    <a class="project-image" href="{{ project.url | relative_url }}">
      <img src="{{ project.thumbnail | relative_url }}" alt="{{ project.title }}">
    </a>
  </div>
  {% endfor %}
</section>
